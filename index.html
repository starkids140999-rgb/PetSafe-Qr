<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetSafe QR - Identificación Segura</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --card-border: #232d42;
      --accent-color: #6366f1;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --warning-bg: rgba(245, 158, 11, 0.1);
      --warning-border: #f59e0b;
      --btn-green: #10b981;
      --btn-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 90px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Cabecera con Logo Oficial */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }

    .header-logo-img {
      height: 48px;
      width: auto;
      object-fit: contain;
    }

    .header-user {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
    }

    .banner {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      line-height: 1.4;
      text-align: center;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.2);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    /* Contenedor de Foto para no deformar/cortar */
    .pet-photo-container {
      width: 100%;
      height: 280px;
      background-color: #0d1117;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--card-border);
    }

    .pet-photo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .pet-name {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .pet-badge {
      display: inline-block;
      background-color: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .alert-box {
      background-color: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: #fef3c7;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .alert-title {
      color: #f59e0b;
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-group {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .info-label {
      color: var(--text-sub);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 1.05rem;
      font-weight: 500;
      color: #e2e8f0;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      margin-top: 10px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-green {
      background-color: var(--btn-green);
      color: #022c22;
    }

    .btn-blue {
      background-color: var(--btn-blue);
      color: #0f172a;
    }

    .status-container {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-sub);
    }

    .error-box {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* Modal / Popup de Ayuda y Mascotas */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
      color: var(--text-main);
    }

    .modal-header {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: #a5b4fc;
    }

    .modal-close {
      margin-top: 16px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
    }

    /* Barra de Navegación Móvil */
    .app-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #111827;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.75rem;
      gap: 4px;
      cursor: pointer;
      border: none;
      background: none;
      width: 25%;
    }

    .nav-item.active {
      color: #818cf8;
      font-weight: bold;
    }

    .nav-icon {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <!-- Logo Oficial integrado directamente -->
      <img src="https://i.ibb.co/L5B7D7y/petsafe-logo.jpg" alt="PetSafe QR Logo" class="header-logo-img">
      <div class="header-user">S</div>
    </div>

    <div class="banner">
      Este perfil usa la información real del registro conectado. Confirma la mascota antes de contactar a su tutor o tutora.
    </div>

    <div id="content" class="card">
      <div id="status" class="status-container">
        ⏳ Cargando información de la mascota...
      </div>
    </div>
  </div>

  <!-- Modal para información / ayuda / lista -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <div id="modal-title" class="modal-header">Título</div>
      <div id="modal-body">Contenido...</div>
      <button class="modal-close" onclick="cerrarModal()">Entendido</button>
    </div>
  </div>

  <!-- Barra de Comandos Tipo App Móvil -->
  <nav class="app-nav">
    <button class="nav-item active" onclick="irInicio()">
      <span class="nav-icon">📲</span>
      <span>Inicio</span>
    </button>

    <button class="nav-item" onclick="abrirBuscarMascotas()">
      <span class="nav-icon">🔍</span>
      <span>Mascotas</span>
    </button>

    <!-- Redirección directa al registro/inicio de sesión de Tally -->
    <a href="https://tally.so/r/68BMZN" target="_blank" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Iniciar Sesión</span>
    </a>

    <button class="nav-item" onclick="abrirAyuda()">
      <span class="nav-icon">❓</span>
      <span>Ayuda</span>
    </button>
  </nav>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxxvZVQ547PYNuUyjjz3DBsjzaWaH8vy8PQEh59rLrkIVQx1YzWV-z1zSCuEOsKC6Q/exec";

    async function cargarMascota() {
      const contentEl = document.getElementById('content');
      
      const urlParams = new URLSearchParams(window.location.search);
      const petId = urlParams.get('id');

      if (!petId) {
        contentEl.innerHTML = `
          <div class="error-box">
            <strong>⚠️ Parámetro faltante</strong><br/>
            No se incluyó el identificador de la mascota en la URL.<br/><br/>
            <small>Ejemplo de uso: ?id=PET001</small>
          </div>
        `;
        return;
      }

      try {
        const res = await fetch(`${API_URL}?id=${encodeURIComponent(petId)}`);
        const data = await res.json();

        if (data.error) {
          contentEl.innerHTML = `
            <div class="error-box">
              <strong>⚠️ No encontrado</strong><br/>
              ${data.error}
            </div>
          `;
          return;
        }

        contentEl.innerHTML = `
          ${data.foto ? `
            <div class="pet-photo-container">
              <img src="${data.foto}" class="pet-photo" alt="${data.nombre}">
            </div>
          ` : ''}
          <div class="pet-name">${data.nombre}</div>
          <div class="pet-badge">🐾 ${data.especie}</div>

          ${data.cuidados ? `
            <div class="alert-box">
              <div class="alert-title">⚠️ CUIDADOS Y SALUD</div>
              ${data.cuidados}
            </div>
          ` : ''}

          <div class="info-group">
            <div class="info-label">Tutor/a registrado</div>
            <div class="info-value">${data.tutor}</div>
          </div>

          ${data.emergencia ? `
            <div class="info-group">
              <div class="info-label">Contacto de emergencia</div>
              <div class="info-value">${data.emergencia}</div>
            </div>
          ` : ''}

          ${data.telefono ? `
            <a href="https://wa.me/${data.telefono.toString().replace(/[^0-9]/g, '')}" target="_blank" class="btn-action btn-green">
              💬 Enviar mensaje seguro al tutor/a
            </a>
            <a href="tel:${data.telefono}" class="btn-action btn-blue">
              📞 Llamar al tutor/a (${data.telefono})
            </a>
          ` : ''}
        `;

      } catch (error) {
        contentEl.innerHTML = `
          <div class="error-box">
            <strong>⚠️ Error de comunicación</strong><br/>
            No fue posible consultar la base de datos de PetSafe QR.<br/>
            <small>${error.message}</small>
          </div>
        `;
      }
    }

    // Funciones interactivas de la App
    function irInicio() {
      const urlParams = new URLSearchParams(window.location.search);
      const petId = urlParams.get('id');
      if (petId) {
        window.location.reload();
      } else {
        alert("Escanea un código QR de PetSafe o ingresa una URL con ID para ver una mascota.");
      }
    }

    function abrirBuscarMascotas() {
      const petId = prompt("Ingresa el ID de la mascota a consultar (Ejemplo: PET001):");
      if (petId) {
        window.location.search = `?id=${petId.trim()}`;
      }
    }

    function abrirAyuda() {
      document.getElementById('modal-title').innerText = "🐾 Ayuda - PetSafe QR";
      document.getElementById('modal-body').innerHTML = `
        <p style="font-size: 0.9rem; line-height: 1.5; color: #94a3b8;">
          <strong>¿Encontraste a una mascota perdida?</strong><br>
          Utiliza los botones de llamada o WhatsApp para ponerte en contacto directo y seguro con su tutor registrado.<br><br>
          <strong>¿Quieres registrar a tu mascota?</strong><br>
          Haz clic en la pestaña <em>"Iniciar Sesión"</em> en la barra inferior para acceder al formulario oficial de registro de Tally.
        </p>
      `;
      document.getElementById('modal').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('modal').style.display = 'none';
    }

    cargarMascota();
  </script>
</body>
</html>
