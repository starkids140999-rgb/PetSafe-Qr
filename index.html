<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetSafe QR - Identificación Segura</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131b2e;
      --inner-card: #1a243b;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-neon: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --warning-bg: rgba(245, 158, 11, 0.1);
      --warning-border: #f59e0b;
      --status-lost-bg: rgba(239, 68, 68, 0.15);
      --status-lost-text: #fca5a5;
      --status-home-bg: rgba(16, 185, 129, 0.15);
      --status-home-text: #6ee7b7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-viewport {
      width: 100%;
      max-width: 450px;
      background-color: #090d16;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 80px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background-color: rgba(9, 13, 22, 0.95);
      position: sticky;
      top: 0;
      z-index: 90;
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.15rem;
      background: linear-gradient(to right, #ffffff, #a5f3fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-avatar-pet {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-neon);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .content-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .banner {
      background: linear-gradient(135deg, #3b82f6 0%, #7c3aed 100%);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.82rem;
      line-height: 1.4;
      text-align: center;
      font-weight: 500;
      color: #ffffff;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
    }

    .pet-photo-box {
      width: 100%;
      height: 260px;
      background-color: #030712;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .pet-photo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .pet-name-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .pet-name-title {
      font-size: 1.6rem;
      font-weight: 800;
    }

    .pet-badge-type {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background-color: rgba(56, 189, 248, 0.12);
      color: var(--accent-neon);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 14px;
      transition: all 0.3s ease;
    }

    .status-badge.perdido {
      background-color: var(--status-lost-bg);
      color: var(--status-lost-text);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-badge.casa {
      background-color: var(--status-home-bg);
      color: var(--status-home-text);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .alert-box {
      background-color: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: #fef3c7;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .alert-title {
      color: #f59e0b;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .info-row {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .info-label {
      color: var(--text-sub);
      font-size: 0.75rem;
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .emergency-box {
      background-color: var(--inner-card);
      border: 1px dashed rgba(245, 158, 11, 0.4);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .btn-unlock-emergency {
      background: transparent;
      border: 1px solid var(--warning-border);
      color: #f59e0b;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      margin-top: 8px;
      border: none;
      cursor: pointer;
    }

    .btn-message {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #ffffff;
    }

    .btn-call {
      background: #1e293b;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-gps {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .gps-box {
      background-color: var(--inner-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
      margin-top: 14px;
    }

    .gps-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gps-desc {
      font-size: 0.8rem;
      color: var(--text-sub);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .privacy-footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-sub);
      line-height: 1.4;
      margin-top: 14px;
      padding: 0 8px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .app-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 450px;
      background-color: rgba(9, 13, 22, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.7rem;
      gap: 4px;
      border: none;
      background: none;
      cursor: pointer;
      width: 25%;
    }

    .nav-btn.active {
      color: var(--accent-neon);
      font-weight: bold;
    }

    .nav-icon-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .nav-btn.active .nav-icon-badge {
      background-color: rgba(56, 189, 248, 0.15);
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <header class="header">
      <div class="brand-logo">
        <div class="logo-icon-box">🐾</div>
        <span class="brand-title">PetSafe QR</span>
      </div>
      <div class="user-avatar-pet">🐶🐱</div>
    </header>

    <div class="content-container">
      <div id="tab-inicio" class="tab-content active">
        <div class="banner">
          Este perfil usa la información real del registro conectado. Confirma la mascota antes de contactar a su tutor o tutora.
        </div>

        <div id="pet-data-container" class="card">
          <div style="text-align: center; padding: 30px; color: var(--text-sub);">
            ⏳ Cargando información de la mascota...
          </div>
        </div>
      </div>
    </div>

    <nav class="app-nav">
      <button class="nav-btn active">
        <div class="nav-icon-badge">📲</div>
        <span>Inicio</span>
      </button>
    </nav>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxxvZVQ547PYNuUyjjz3DBsjzaWaH8vy8PQEh59rLrkIVQx1YzWV-z1zSCuEOsKC6Q/exec";
    let telefonoTutor = "";
    let nombreMascota = "";
    let nombreEmergencia = "";
    let telefonoEmergenciaReal = "";
    let esPrimeraCarga = true;

    function parsearContactoEmergencia(cadenaRaw) {
      if (!cadenaRaw) return { nombre: "Contacto de Apoyo", numero: "" };
      const partes = cadenaRaw.split(':');
      if (partes.length >= 2) {
        return { nombre: partes[0].trim(), numero: partes.slice(1).join(':').replace(/[^0-9]/g, '') };
      }
      const soloNumeros = cadenaRaw.replace(/[^0-9]/g, '');
      if (soloNumeros.length > 6) {
        return { nombre: "Contacto de Apoyo", numero: soloNumeros };
      }
      return { nombre: cadenaRaw.trim(), numero: "" };
    }

    async function obtenerDatos() {
      const urlParams = new URLSearchParams(window.location.search);
      let petId = urlParams.get('id') || "PET001";
      const res = await fetch(`${API_URL}?id=${encodeURIComponent(petId)}&t=${Date.now()}`);
      return await res.json();
    }

    async function actualizarEstadoEnVivo() {
      try {
        const data = await obtenerDatos();
        if (data.error) return;

        const container = document.getElementById('pet-data-container');
        telefonoTutor = data.telefono ? data.telefono.toString().replace(/[^0-9]/g, '') : "";
        nombreMascota = data.nombre || "la mascota";

        const parsedEmergencia = parsearContactoEmergencia(data.emergencia);
        nombreEmergencia = parsedEmergencia.nombre;
        telefonoEmergenciaReal = parsedEmergencia.numero;

        const estadoRaw = (data.estado || "").toLowerCase();
        const estaEnCasa = estadoRaw.includes('casa') || estadoRaw.includes('tutor') || estadoRaw.includes('encontrad') || estadoRaw.includes('normal');
        
        const estadoTexto = estaEnCasa ? "Con tutor" : "Perdido";
        const estadoClase = estaEnCasa ? "casa" : "perdido";
        const estadoEmoji = estaEnCasa ? "🏠" : "🚨";

        const mensajeAuto = estaEnCasa 
          ? encodeURIComponent(`Hola, estoy viendo el perfil de ${nombreMascota} en PetSafe QR y quisiera ponerme en contacto contigo.`)
          : encodeURIComponent(`Hola, estoy viendo el perfil de ${nombreMascota} en PetSafe QR. Encontré a la mascota o tengo información sobre su paradero. Por favor ponte en contacto conmigo.`);

        // Si es la primera vez que abre la app, se renderiza la vista completa
        if (esPrimeraCarga) {
          container.innerHTML = `
            ${data.foto ? `
              <div class="pet-photo-box">
                <img src="${data.foto}" class="pet-photo-img" alt="${data.nombre}">
              </div>
            ` : ''}

            <div class="pet-name-header">
              <span class="pet-name-title">${data.nombre}</span>
              <span class="pet-badge-type">🐾 ${data.especie}</span>
            </div>

            <div id="status-badge-element" class="status-badge ${estadoClase}">
              ${estadoEmoji} Estado: ${estadoTexto}
            </div>

            ${data.cuidados ? `
              <div class="alert-box">
                <div class="alert-title">⚠️ CUIDADOS Y SALUD</div>
                ${data.cuidados}
              </div>
            ` : ''}

            <div class="info-row">
              <div class="info-label">Tutor registrado</div>
              <div class="info-value">${data.tutor}</div>
            </div>

            <div class="emergency-box">
              <div class="info-label" style="color:#f59e0b; font-weight:700;">🆘 Apoyo de emergencia</div>
              <div class="info-value" style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
                <span>${nombreEmergencia}</span>
                <span id="emergency-phone-display" style="font-size:0.85rem; color:var(--text-sub); letter-spacing:1px;">••••••••</span>
              </div>

              <div id="emergency-action-container">
                <button class="btn-unlock-emergency" onclick="revelarContactoEmergencia()">
                  👁️ ¿No logras contactar al tutor? Mostrar teléfono de emergencia
                </button>
              </div>
            </div>

            ${telefonoTutor ? `
              <a id="btn-whatsapp-link" href="https://wa.me/${telefonoTutor}?text=${mensajeAuto}" target="_blank" class="btn-action btn-message">
                💬 Enviar mensaje seguro al tutor
              </a>
              <a href="tel:${telefonoTutor}" class="btn-action btn-call">
                📞 Llamar mediante enlace privado
              </a>
            ` : ''}

            <div class="gps-box">
              <div class="gps-title">📍 Activar ubicación de rescate</div>
              <div class="gps-desc">
                Tu navegador solicitará permiso GPS. Solo se enviará una coordenada aproximada al tutor para avisarle en qué punto exacto fue encontrado ${nombreMascota}.
              </div>
              <button class="btn-action btn-gps" onclick="enviarUbicacionGPS()">
                Compartir mi ubicación actual con el tutor
              </button>
            </div>

            <div class="privacy-footer-note">
              🛡️ <strong>Privacidad PetSafe QR protegida</strong><br>
              El número telefónico permanece oculto para proteger la identidad de la familia.
            </div>
          `;
          esPrimeraCarga = false;
        } else {
          // Actualización silenciosa e instantánea solo del Badge de Estado y el link de WhatsApp
          const badgeElem = document.getElementById('status-badge-element');
          const waLinkElem = document.getElementById('btn-whatsapp-link');

          if (badgeElem) {
            badgeElem.className = `status-badge ${estadoClase}`;
            badgeElem.innerHTML = `${estadoEmoji} Estado: ${estadoTexto}`;
          }

          if (waLinkElem) {
            waLinkElem.href = `https://wa.me/${telefonoTutor}?text=${mensajeAuto}`;
          }
        }
      } catch (err) {
        console.error("Error actualizando datos:", err);
      }
    }

    function revelarContactoEmergencia() {
      const display = document.getElementById('emergency-phone-display');
      const container = document.getElementById('emergency-action-container');
      const numMostrar = telefonoEmergenciaReal || "0991239801";
      display.innerText = numMostrar;
      display.style.color = "#38bdf8";
      display.style.fontWeight = "700";

      container.innerHTML = `
        <a href="tel:${numMostrar}" class="btn-action btn-call" style="margin-top:8px; background:#b45309; border:none;">
          📞 Llamar a ${nombreEmergencia} ahora
        </a>
      `;
    }

    function enviarUbicacionGPS() {
      if (!navigator.geolocation) {
        alert("Tu navegador no soporta geolocalización.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const mapsUrl = `https://maps.google.com/?q=$${lat},${lon}`;
          const mensaje = encodeURIComponent(`Hola, encontré a ${nombreMascota} usando la placa PetSafe QR. Esta es mi ubicación actual para el rescate: ${mapsUrl}`);

          if (telefonoTutor) {
            window.open(`https://wa.me/${telefonoTutor}?text=${mensaje}`, '_blank');
          } else {
            alert(`Ubicación obtenida: ${mapsUrl}`);
          }
        },
        () => {
          alert("No se pudo obtener la ubicación. Por favor concede permisos GPS a tu navegador.");
        }
      );
    }

    // Primera carga inmediata
    actualizarEstadoEnVivo();

    // POLING EN TIEMPO REAL: Consulta el estado en Google Sheets cada 5000ms (5 segundos)
    setInterval(actualizarEstadoEnVivo, 5000);
  </script>
</body>
</html>
