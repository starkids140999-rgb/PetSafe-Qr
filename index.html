<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetSafe QR - Identificación Segura</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --card-border: #232d42;
      --accent-color: #6366f1;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --warning-bg: rgba(245, 158, 11, 0.1);
      --warning-border: #f59e0b;
      --btn-green: #10b981;
      --btn-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: #a5b4fc;
      padding: 8px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .banner {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      line-height: 1.4;
      text-align: center;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .pet-photo {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 16px;
      background-color: #1e293b;
    }

    .pet-name {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .pet-badge {
      display: inline-block;
      background-color: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .alert-box {
      background-color: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: #fef3c7;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .alert-title {
      color: #f59e0b;
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-group {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .info-label {
      color: var(--text-sub);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 1.05rem;
      font-weight: 500;
      color: #e2e8f0;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .btn-green {
      background-color: var(--btn-green);
      color: #022c22;
    }

    .btn-blue {
      background-color: var(--btn-blue);
      color: #0f172a;
    }

    .status-container {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-sub);
    }

    .error-box {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      🐾 PetSafe QR
    </div>

    <div class="banner">
      Este perfil usa la información real del registro conectado. Confirma la mascota antes de contactar a su tutor o tutora.
    </div>

    <div id="content" class="card">
      <div id="status" class="status-container">
        ⏳ Cargando información de la mascota...
      </div>
    </div>
  </div>

  <script>
    // URL de tu API de Google Apps Script actualizada
    const API_URL = "https://script.google.com/macros/s/AKfycbwF4M2ex21jA5nxkN3NihYSWASm4GR9lHR_8pTYvjrtz1vP3g0bHH9Oist72OYRIt2Y/exec";

    async function cargarMascota() {
      const contentEl = document.getElementById('content');
      
      const urlParams = new URLSearchParams(window.location.search);
      const petId = urlParams.get('id');

      if (!petId) {
        contentEl.innerHTML = `
          <div class="error-box">
            <strong>⚠️ Parámetro faltante</strong><br/>
            No se incluyó el identificador en la URL.<br/>
            <small>Ejemplo correcto: ?id=PET001</small>
          </div>
        `;
        return;
      }

      try {
        const res = await fetch(`${API_URL}?id=${encodeURIComponent(petId)}`);
        const data = await res.json();

        if (data.error) {
          contentEl.innerHTML = `
            <div class="error-box">
              <strong>⚠️ No encontrado</strong><br/>
              ${data.error}
            </div>
          `;
          return;
        }

        contentEl.innerHTML = `
          ${data.foto ? `<img src="${data.foto}" class="pet-photo" alt="${data.nombre}">` : ''}
          <div class="pet-name">${data.nombre}</div>
          <div class="pet-badge">${data.especie}</div>

          ${data.cuidados ? `
            <div class="alert-box">
              <div class="alert-title">⚠️ CUIDADOS Y SALUD</div>
              ${data.cuidados}
            </div>
          ` : ''}

          <div class="info-group">
            <div class="info-label">Tutor/a registrado</div>
            <div class="info-value">${data.tutor}</div>
          </div>

          ${data.emergencia ? `
            <div class="info-group">
              <div class="info-label">Contacto de emergencia</div>
              <div class="info-value">${data.emergencia}</div>
            </div>
          ` : ''}

          ${data.telefono ? `
            <a href="https://wa.me/${data.telefono.toString().replace(/[^0-9]/g, '')}" target="_blank" class="btn-action btn-green">
              💬 Enviar mensaje a tutor/a
            </a>
            <a href="tel:${data.telefono}" class="btn-action btn-blue">
              📞 Llamar al tutor/a (${data.telefono})
            </a>
          ` : ''}
        `;

      } catch (error) {
        contentEl.innerHTML = `
          <div class="error-box">
            <strong>⚠️ Error de comunicación</strong><br/>
            No fue posible consultar la base de datos.<br/>
            <small>${error.message}</small>
          </div>
        `;
      }
    }

    cargarMascota();
  </script>
</body>
</html>
